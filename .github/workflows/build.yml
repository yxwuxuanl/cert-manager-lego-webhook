name: build push docker image

on:
  push:
    branches:
      - main
      - dev
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.x'
      - uses: ko-build/setup-ko@v0.10
      - run: ko build --sbom=none --bare -t ${{ github.ref_name }}
